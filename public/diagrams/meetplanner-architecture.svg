<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">MeetPlanner architecture</title>
  <desc id="desc">Slack and email feed into an intent classifier, which routes to async templates, no-meeting nudges, or calendar handoff. An operator console reads from the routing table.</desc>
  <defs>
    <style>
      .bg { fill: #FBFBFD; }
      .node { fill: #FFFFFF; stroke: #D2D2D7; stroke-width: 1; }
      .node-accent { fill: #E8F0EA; stroke: #15573D; stroke-width: 1.25; }
      .label { font-family: ui-sans-serif, -apple-system, "SF Pro Text", system-ui, sans-serif; font-size: 14px; fill: #1D1D1F; }
      .label-sm { font-family: ui-sans-serif, -apple-system, "SF Pro Text", system-ui, sans-serif; font-size: 11px; fill: #6E6E73; letter-spacing: 0.06em; text-transform: uppercase; }
      .arrow { stroke: #6E6E73; stroke-width: 1.25; fill: none; }
      .arrow-accent { stroke: #15573D; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6E6E73"/>
    </marker>
    <marker id="arrowhead-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15573D"/>
    </marker>
  </defs>

  <rect class="bg" width="960" height="480"/>

  <!-- Sources -->
  <text x="56" y="56" class="label-sm">Sources</text>
  <rect class="node" x="40" y="80" width="160" height="60" rx="14"/>
  <text x="120" y="116" class="label" text-anchor="middle">Slack workflows</text>
  <rect class="node" x="40" y="170" width="160" height="60" rx="14"/>
  <text x="120" y="206" class="label" text-anchor="middle">Email intake</text>

  <!-- Classifier -->
  <text x="380" y="56" class="label-sm">Routing brain</text>
  <rect class="node-accent" x="320" y="120" width="220" height="80" rx="14"/>
  <text x="430" y="155" class="label" text-anchor="middle" font-weight="500">Intent classifier</text>
  <text x="430" y="178" class="label-sm" text-anchor="middle" style="text-transform:none;letter-spacing:0">decision · status · unblock · pairing</text>

  <!-- Routes -->
  <text x="760" y="56" class="label-sm">Resolution</text>
  <rect class="node" x="700" y="40" width="220" height="64" rx="14"/>
  <text x="810" y="76" class="label" text-anchor="middle">No-meeting nudge</text>
  <rect class="node" x="700" y="124" width="220" height="64" rx="14"/>
  <text x="810" y="160" class="label" text-anchor="middle">Async checkpoint template</text>
  <rect class="node" x="700" y="208" width="220" height="64" rx="14"/>
  <text x="810" y="244" class="label" text-anchor="middle">Calendar handoff</text>

  <!-- Edges -->
  <path class="arrow" d="M200,110 C260,110 280,150 320,150" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M200,200 C260,200 280,170 320,170" marker-end="url(#arrowhead)"/>
  <path class="arrow-accent" d="M540,140 C600,140 620,72 700,72" marker-end="url(#arrowhead-accent)"/>
  <path class="arrow-accent" d="M540,160 C620,160 640,156 700,156" marker-end="url(#arrowhead-accent)"/>
  <path class="arrow-accent" d="M540,180 C600,180 620,240 700,240" marker-end="url(#arrowhead-accent)"/>

  <!-- Operator console + routing table -->
  <text x="380" y="296" class="label-sm">Memory · audit</text>
  <rect class="node" x="40" y="320" width="220" height="64" rx="14"/>
  <text x="150" y="356" class="label" text-anchor="middle">Routing table (Postgres)</text>

  <rect class="node" x="320" y="320" width="220" height="64" rx="14"/>
  <text x="430" y="356" class="label" text-anchor="middle">Operator console</text>

  <rect class="node" x="600" y="320" width="220" height="64" rx="14"/>
  <text x="710" y="356" class="label" text-anchor="middle">Resend transactional</text>

  <!-- Edges to memory + console -->
  <path class="arrow" d="M260,352 L320,352" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M540,352 L600,352" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M430,200 L430,320" marker-end="url(#arrowhead)"/>

  <!-- Legend -->
  <line x1="40" y1="430" x2="60" y2="430" class="arrow"/>
  <text x="68" y="434" class="label-sm" style="text-transform:none;letter-spacing:0">data flow</text>
  <line x1="160" y1="430" x2="180" y2="430" class="arrow-accent"/>
  <text x="188" y="434" class="label-sm" style="text-transform:none;letter-spacing:0">decision path</text>
</svg>
