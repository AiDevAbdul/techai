<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">Marketing Dash architecture</title>
  <desc id="desc">Six marketing channels feed a nightly normalizer into BigQuery. A structured AI summarizer drafts a daily report, which lands in an operator console for review before Resend ships it. An audit log records every draft, edit, and send.</desc>
  <defs>
    <style>
      .bg { fill: #FBFBFD; }
      .node { fill: #FFFFFF; stroke: #D2D2D7; stroke-width: 1; }
      .node-accent { fill: #E8F0EA; stroke: #15573D; stroke-width: 1.25; }
      .label { font-family: ui-sans-serif, -apple-system, "SF Pro Text", system-ui, sans-serif; font-size: 14px; fill: #1D1D1F; }
      .label-sm { font-family: ui-sans-serif, -apple-system, "SF Pro Text", system-ui, sans-serif; font-size: 11px; fill: #6E6E73; letter-spacing: 0.06em; text-transform: uppercase; }
      .arrow { stroke: #6E6E73; stroke-width: 1.25; fill: none; }
      .arrow-accent { stroke: #15573D; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6E6E73"/>
    </marker>
    <marker id="arrowhead-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15573D"/>
    </marker>
  </defs>

  <rect class="bg" width="960" height="480"/>

  <!-- Sources -->
  <text x="56" y="40" class="label-sm">Channels</text>
  <rect class="node" x="40" y="56" width="160" height="44" rx="14"/>
  <text x="120" y="83" class="label" text-anchor="middle">Google Analytics</text>
  <rect class="node" x="40" y="108" width="160" height="44" rx="14"/>
  <text x="120" y="135" class="label" text-anchor="middle">Plausible</text>
  <rect class="node" x="40" y="160" width="160" height="44" rx="14"/>
  <text x="120" y="187" class="label" text-anchor="middle">Meta Ads</text>
  <rect class="node" x="40" y="212" width="160" height="44" rx="14"/>
  <text x="120" y="239" class="label" text-anchor="middle">Google Ads</text>
  <rect class="node" x="40" y="264" width="160" height="44" rx="14"/>
  <text x="120" y="291" class="label" text-anchor="middle">CRM</text>

  <!-- Normalizer -->
  <text x="320" y="40" class="label-sm">Ingestion</text>
  <rect class="node" x="280" y="120" width="180" height="64" rx="14"/>
  <text x="370" y="148" class="label" text-anchor="middle">Nightly normalizer</text>
  <text x="370" y="168" class="label-sm" text-anchor="middle" style="text-transform:none;letter-spacing:0">one schema, 6 channels</text>

  <!-- Summarizer (accent) -->
  <text x="560" y="40" class="label-sm">Drafting brain</text>
  <rect class="node-accent" x="520" y="104" width="220" height="96" rx="14"/>
  <text x="630" y="138" class="label" text-anchor="middle" font-weight="500">AI summarizer</text>
  <text x="630" y="160" class="label-sm" text-anchor="middle" style="text-transform:none;letter-spacing:0">7-day baseline · anomalies</text>
  <text x="630" y="180" class="label-sm" text-anchor="middle" style="text-transform:none;letter-spacing:0">structured JSON draft</text>

  <!-- Review surface (accent endpoint) -->
  <text x="820" y="40" class="label-sm">Review</text>
  <rect class="node" x="780" y="104" width="160" height="48" rx="14"/>
  <text x="860" y="133" class="label" text-anchor="middle">Drafted report</text>
  <rect class="node" x="780" y="160" width="160" height="48" rx="14"/>
  <text x="860" y="189" class="label" text-anchor="middle">Review &amp; send</text>

  <!-- Edges: channels -> normalizer -->
  <path class="arrow" d="M200,78 C240,78 250,148 280,148" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M200,130 C240,130 250,150 280,150" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M200,182 C240,182 250,154 280,154" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M200,234 C240,234 250,158 280,158" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M200,286 C240,286 250,162 280,162" marker-end="url(#arrowhead)"/>

  <!-- Edges: normalizer -> summarizer (accent: decision flow begins) -->
  <path class="arrow-accent" d="M460,152 C490,152 500,152 520,152" marker-end="url(#arrowhead-accent)"/>

  <!-- Edges: summarizer -> drafted report -> review (accent) -->
  <path class="arrow-accent" d="M740,128 C760,128 762,128 780,128" marker-end="url(#arrowhead-accent)"/>
  <path class="arrow-accent" d="M740,176 C760,176 762,184 780,184" marker-end="url(#arrowhead-accent)"/>

  <!-- Memory / audit row -->
  <text x="320" y="332" class="label-sm">Memory · audit</text>
  <rect class="node" x="40" y="352" width="220" height="64" rx="14"/>
  <text x="150" y="380" class="label" text-anchor="middle">BigQuery warehouse</text>
  <text x="150" y="400" class="label-sm" text-anchor="middle" style="text-transform:none;letter-spacing:0">normalized rows + audit log</text>

  <rect class="node" x="320" y="352" width="220" height="64" rx="14"/>
  <text x="430" y="380" class="label" text-anchor="middle">Operator console</text>
  <text x="430" y="400" class="label-sm" text-anchor="middle" style="text-transform:none;letter-spacing:0">drill into source row</text>

  <rect class="node" x="600" y="352" width="220" height="64" rx="14"/>
  <text x="710" y="380" class="label" text-anchor="middle">Resend distribution</text>
  <text x="710" y="400" class="label-sm" text-anchor="middle" style="text-transform:none;letter-spacing:0">per-recipient filter</text>

  <!-- Edges to memory row -->
  <path class="arrow" d="M370,184 L370,352" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M260,384 L320,384" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M540,384 L600,384" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M860,208 C860,300 740,330 710,352" marker-end="url(#arrowhead)"/>

  <!-- Legend -->
  <line x1="40" y1="446" x2="60" y2="446" class="arrow"/>
  <text x="68" y="450" class="label-sm" style="text-transform:none;letter-spacing:0">data flow</text>
  <line x1="160" y1="446" x2="180" y2="446" class="arrow-accent"/>
  <text x="188" y="450" class="label-sm" style="text-transform:none;letter-spacing:0">decision path</text>
</svg>
